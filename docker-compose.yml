
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_secret_2025}
      POSTGRES_DB: ${POSTGRES_ROOT_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
#      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: hrms-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-4000}:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - AUTH_SERVICE_URL=http://auth-service:4001
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - PAYROLL_SERVICE_URL=http://payroll-service:4003
      - LEAVE_SERVICE_URL=http://leave-service:4004
      - CLAIMS_SERVICE_URL=http://claims-service:4005
      - RECRUITMENT_SERVICE_URL=http://recruitment-service:4006
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4007
      - OFFBOARDING_SERVICE_URL=http://offboarding-service:4008
      - NOTIFICATION_SERVICE_URL=http://notification-service:4009
      - REPORTING_SERVICE_URL=http://reporting-service:4010
      - ASSET_SERVICE_URL=http://asset-service:4011
      - PERFORMANCE_SERVICE_URL=http://performance-service:4012
      - TRAINING_SERVICE_URL=http://training-service:4013
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      - auth-service
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: hrms-auth
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-4001}:4001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${AUTH_DB:-hrms_auth}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PRIVATE_KEY_PATH=/app/certs/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES:-8h}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES:-7d}
      - INTERNAL_SERVICE_KEY=***REMOVED***
      - EMPLOYEE_DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${EMPLOYEE_DB:-hrms_employee}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
    volumes:
      - shared_certs:/app/certs
      - /app/services/auth-service/node_modules
#      - ./shared:/app/shared
      - /app/shared/auth-middleware/node_modules
      - /app/shared/payroll-utils/node_modules
      - /app/shared/crypto/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  face-service:
    build:
      context: .
      dockerfile: services/face-service/Dockerfile
    container_name: hrms-face
    restart: unless-stopped
    expose:
      - "5010"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  employee-service:
    build:
      context: .
      dockerfile: services/employee-service/Dockerfile
    container_name: hrms-employee
    restart: unless-stopped
    ports:
      - "${EMPLOYEE_SERVICE_PORT:-4002}:4002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${EMPLOYEE_DB:-hrms_employee}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - INTERNAL_SERVICE_KEY=***REMOVED***
      - AUTH_SERVICE_URL=http://auth-service:4001
      - FACE_SERVICE_URL=http://face-service:5010
    volumes:
      - shared_certs:/app/certs:ro
      - /app/services/employee-service/node_modules
#      - ./shared:/app/shared
      - /app/shared/auth-middleware/node_modules
      - /app/shared/crypto/node_modules
      - employee_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      face-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  payroll-service:
    build:
      context: .
      dockerfile: services/payroll-service/Dockerfile
    container_name: hrms-payroll
    restart: unless-stopped
    ports:
      - "${PAYROLL_SERVICE_PORT:-4003}:4003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4003
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${PAYROLL_DB:-hrms_payroll}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - LEAVE_SERVICE_URL=http://leave-service:4004
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4007
      - NOTIFICATION_SERVICE_URL=http://notification-service:4009
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-***REMOVED***}
      - DISABLE_MAKER_CHECKER=${DISABLE_MAKER_CHECKER:-true}
      - COMPANY_NAME=${COMPANY_NAME:-VORKHIVE PTE LTD}
      - COMPANY_UEN=${COMPANY_UEN:-202512345A}
      - UOB_ACCOUNT_NO=${UOB_ACCOUNT_NO:-}
      - OCBC_ACCOUNT_NO=${OCBC_ACCOUNT_NO:-}
      - DBS_ACCOUNT_NO=${DBS_ACCOUNT_NO:-}
    volumes:
      - shared_certs:/app/certs:ro
      - /app/services/payroll-service/node_modules
#      - ./shared:/app/shared
      - /app/shared/auth-middleware/node_modules
      - /app/shared/payroll-utils/node_modules
      - /app/shared/crypto/node_modules
      - payroll_files:/app/generated
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  leave-service:
    build:
      context: .
      dockerfile: services/leave-service/Dockerfile
    container_name: hrms-leave
    restart: unless-stopped
    ports:
      - "${LEAVE_SERVICE_PORT:-4004}:4004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${LEAVE_DB:-hrms_leave}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - NOTIFICATION_SERVICE_URL=http://notification-service:4009
      - INTERNAL_SERVICE_KEY=***REMOVED***
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
    volumes:
      - shared_certs:/app/certs:ro
      - leave_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  claims-service:
    build:
      context: .
