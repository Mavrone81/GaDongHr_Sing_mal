      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - LEAVE_SERVICE_URL=http://leave-service:4004
      - NOTIFICATION_SERVICE_URL=http://notification-service:4009
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  offboarding-service:
    build:
      context: .
      dockerfile: services/offboarding-service/Dockerfile
    container_name: hrms-offboarding
    restart: unless-stopped
    ports:
      - "${OFFBOARDING_SERVICE_PORT:-4008}:4008"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4008
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${OFFBOARDING_DB:-hrms_offboarding}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - PAYROLL_SERVICE_URL=http://payroll-service:4003
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - LEAVE_SERVICE_URL=http://leave-service:4004
      - CLAIMS_SERVICE_URL=http://claims-service:4005
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: hrms-notification
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-4009}:4009"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4009
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${NOTIFICATION_DB:-hrms_notification}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@vorkhive.sg}
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    container_name: hrms-reporting
    restart: unless-stopped
    ports:
      - "${REPORTING_SERVICE_PORT:-4010}:4010"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4010
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/${REPORTING_DB:-hrms_reporting}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - PAYROLL_SERVICE_URL=http://payroll-service:4003
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - LEAVE_SERVICE_URL=http://leave-service:4004
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4007
      - TRAINING_SERVICE_URL=http://training-service:4013
      - INTERNAL_SERVICE_KEY=***REMOVED***
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  performance-service:
    build:
      context: .
      dockerfile: services/performance-service/Dockerfile
    container_name: hrms-performance
    restart: unless-stopped
    ports:
      - "${PERFORMANCE_SERVICE_PORT:-4012}:4012"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4012
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/hrms_performance
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  training-service:
    build:
      context: .
      dockerfile: services/training-service/Dockerfile
    container_name: hrms-training
    restart: unless-stopped
    ports:
      - "${TRAINING_SERVICE_PORT:-4013}:4013"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4013
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/hrms_training
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  asset-service:
    build:
      context: .
      dockerfile: services/asset-service/Dockerfile
    container_name: hrms-asset
    restart: unless-stopped
    ports:
      - "${ASSET_SERVICE_PORT:-4011}:4011"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4011
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_secret_2025}@postgres:5432/hrms_asset
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
    volumes:
      - shared_certs:/app/certs:ro
    depends_on:
