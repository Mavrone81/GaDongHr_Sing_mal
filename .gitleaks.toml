# Vorkhive HRMS — gitleaks config
#
# Extends gitleaks' default ruleset; adds a few project-specific rules and an
# allowlist for fixture/test data that would otherwise trigger false positives.

title = "Vorkhive HRMS"

[extend]
useDefault = true

# ── Project-specific rules ──────────────────────────────────────────────────

[[rules]]
id = "vorkhive-internal-service-key-literal"
description = "Hardcoded 'dev-internal-key' fallback (VAPT C-07)"
regex = '''dev-internal-key'''
tags = ["secret", "vapt"]

[[rules]]
id = "vorkhive-encryption-key-literal"
description = "Hardcoded 'dev-encryption-key-...' fallback"
regex = '''dev-encryption-key-[a-z0-9-]{16,}'''
tags = ["secret", "vapt"]

[[rules]]
id = "vorkhive-default-admin-password"
description = "Seed/initial '***REMOVED***' fallback (VAPT C-05)"
regex = '''***REMOVED***'''
tags = ["secret", "vapt"]

[[rules]]
id = "vorkhive-default-bulk-sync-password"
description = "Bulk-sync '***REMOVED***' fallback (VAPT C-06)"
regex = '''***REMOVED***'''
tags = ["secret", "vapt"]

# ── Allowlist ───────────────────────────────────────────────────────────────

[allowlist]
description = "Project paths intentionally containing fixture, doc, or build text"
paths = [
  # Docs that catalogue the literals as historical findings
  '''VAPT_REPORT\.md''',
  '''TESTING\.md''',
  '''IMPLEMENTATION_STATUS\.md''',
  '''\.gitleaks\.toml''',
  '''demo\.html''',
  '''Vorkhive_PRD_v2\.txt''',
  # Local-only Claude harness state
  '''\.claude/.*''',
  # Build outputs — non-source, regenerated by `next build`
  '''frontend/\.next/.*''',
  # Test fixtures + test suites that intentionally reference the literals
  '''e2e/lib/testUsers\.ts''',
  '''e2e/scripts/seed-test-users\.js''',
  '''e2e/tests/security-.*\.spec\.ts''',
  '''services/.*/__tests__/.*\.(test|spec)\.js''',
  # T4 scripts may reference test credentials in fixture strings
  '''scripts/t4/.*''',
  # Generated dev certs (gitignored anyway, but gitleaks scans the worktree)
  '''certs/.*\.pem''',
  # Vendored deps
  '''node_modules/.*''',
  # .env is gitignored; the values are operator-supplied secrets, not source
  '''\.env''',
  '''\.env\..*''',
  # Source files whose only match is a comment citing the *previous* literal
  # as part of the remediation note. The current code reads the env var.
  '''services/attendance-service/src/index\.js''',
  '''services/payroll-service/src/routes/payroll\.routes\.js''',
  # Dev seed scripts retain literal fallbacks for local-only runs but throw
  # when NODE_ENV=production. The real defence is the runtime guard.
  '''scripts/seed.*\.js''',
]
regexes = [
  '''TestE2E@2026!''',              # documented test password used by E2E
]
stopwords = [
  "ENCRYPTION_KEY=",                # .env line prefixes — value is what matters
  "INTERNAL_SERVICE_KEY=",
  "INVITE_TOKEN_SECRET=",
]
