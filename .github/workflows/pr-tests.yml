name: PR tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # VAPT §9 recommended a permanent CI security gate. Only a local pre-commit
  # hook was ever added, and from 2026-07-13 it was broken — a redaction marker
  # left in .gitleaks.toml made gitleaks panic on config load, so it blocked
  # 100% of commits while detecting 0% of secrets. A developer-machine hook is
  # also bypassable with --no-verify and absent on fresh clones; CI is the only
  # place this can actually gate.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Full clone: a history scan needs the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run via the official image rather than the marketplace action: the
      # action requires a paid licence for GitHub Organizations, and the image
      # avoids pinning a release-asset filename that changes between versions.
      #
      # Scans FULL HISTORY, not just the working tree. This previously used
      # --no-git, on the stated grounds that history still held the credentials
      # the 2026-07-13 scrub replaced and so would fail every run. That turned
      # out not to be true: gitleaks over all 248 commits returns exactly one
      # finding — the dummy 64-hex ENCRYPTION_KEY fallback this workflow uses so
      # the e2e job can boot without a real secret — pinned by fingerprint in
      # .gitleaksignore. No .env was ever committed and no real key format
      # appears anywhere in history.
      #
      # Scanning history matters because a working-tree scan cannot see a secret
      # that was committed and then removed in a later commit — which is the
      # normal shape of an accidental credential leak.
      - name: Scan full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # BLOCKING on critical. Zero today, and a critical in a transitive
      # dependency is the case where shipping without looking is indefensible.
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical

      # REPORTING on high. Seven remain, and every one needs a MAJOR upgrade
      # rather than a patch, so gating on high would mean a permanently red
      # pipeline that people learn to ignore — which is worse than an honest
      # amber. They are, with the upgrade each needs:
      #
      #   next, postcss              -> next@16          (framework major)
      #   eslint-config-next, glob,
      #   @next/eslint-plugin-next   -> eslint-config-next@16   (dev only)
      #   nodemailer                 -> nodemailer@9     (payslip email path)
      #   node-fetch                 -> face-api.js@0.20 (attendance face match)
      #
      # Six other highs WERE fixed here without breaking changes, including an
      # axios authentication bypass, a form-data CRLF injection, and a nodemailer
      # bug that could deliver mail to an unintended domain — which matters on a
      # product that emails payslips.
      #
      # When one of these upgrades lands, drop it from this list. When the list
      # is empty, promote the gate from critical to high.
      - name: Report high vulnerabilities (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  backend-and-frontend:
    name: Backend + frontend unit/integration (TZ ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runners default to UTC. Every business timezone this product serves is
        # +08, and date-only bugs that mix local accessors with UTC
        # serialisation are INVISIBLE under UTC — they only misbehave off it.
        # A server-side one shipped this way: countWorkingDays keyed public
        # holidays a day early in +08, so EA s.20 pro-rated salary was wrong on
        # any SG/MY machine while CI stayed green. Asia/Singapore is the guard
        # that would have caught it.
        tz: [UTC, Asia/Singapore]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:backend
      - run: npm run test:frontend

  # Cross-tenant isolation. Separate from the unit job because these suites need
  # a real Postgres AND each service's own generated Prisma client — @prisma/client
  # is hoisted in this workspace, so `prisma generate` for one service overwrites
  # every other, and all five can never pass in a single jest invocation. The
  # runner does one service per pass.
  #
  # These are the tests proving tenant A cannot read tenant B's data. They had
  # never actually run — they failed to LOAD in the unit job and were written off
  # as "known failing". They pass 16/16 when run correctly.
  tenant-isolation:
    name: Cross-tenant isolation (DB-backed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: ci_postgres_pw_2026
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Create per-service databases
        run: |
          for db in hrms_auth hrms_employee hrms_payroll hrms_leave hrms_attendance; do
            PGPASSWORD=ci_postgres_pw_2026 psql -h localhost -U hrms -d postgres -c "CREATE DATABASE $db;"
          done
      - name: Run cross-tenant isolation suites
        run: |
          # The runner reads credentials from .env, which is git-ignored and so
          # absent in CI. Write a CI-only one matching the service block above.
          printf 'POSTGRES_USER=hrms\nPOSTGRES_PASSWORD=ci_postgres_pw_2026\nPOSTGRES_PORT=5432\n' > .env
          npm run test:isolation

  e2e:
    name: End-to-end (RBAC + smoke + happy paths)
    runs-on: ubuntu-latest
    needs: backend-and-frontend
    # Env for the docker-compose stack. Production hardening (M-02/C-07/C-08/C-10)
    # makes these fail-closed: POSTGRES_PASSWORD is mandatory and the services
    # refuse to start without INTERNAL_SERVICE_KEY / INVITE_TOKEN_SECRET /
    # ENCRYPTION_KEY. Use repo secrets when present, else CI-only throwaway values.
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_postgres_pw_2026' }}
      # Must be a 64-char hex string (32 bytes) — shared/crypto enforces this.
      # The fallback is a visibly-dummy repeating pattern used only by the
      # ephemeral CI stack. Annotated per-line so the rest of this file stays
      # scanned, rather than allowlisting the whole workflow.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }} # gitleaks:allow
      INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY || 'ci-internal-service-key-2026' }}
      INVITE_TOKEN_SECRET: ${{ secrets.INVITE_TOKEN_SECRET || 'ci_invite_token_secret_0123456789abcdef0123456789abcdef0123456789' }}
      # e2e/scripts/seed-test-users.js + the security specs expect the seeded
      # SUPER_ADMIN to be admin@hrms.com, so seed:admin must create that email.
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@hrms.com' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'CiAdmin#2026!' }}
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      SMTP_USER: ${{ secrets.SMTP_USER || '' }}
      SMTP_PASS: ${{ secrets.SMTP_PASS || '' }}
      # The RBAC matrix fires hundreds of requests/min from one IP, which trips
      # the gateway's default 200/min limiter and 429s unrelated specs. Raise it
      # for the suite; the dedicated rate-limit spec (X-04) skips itself when the
      # _TEST_OVERRIDE is set high, so it stays meaningful without bursting >1k req.
      GATEWAY_RATELIMIT_MAX: '100000'
      GATEWAY_RATELIMIT_MAX_TEST_OVERRIDE: '100000'
      # Reset/login limiters likewise throttle the auth specs.
      RESET_RATELIMIT_MAX: '100000'
      # Host port the postgres container is published on (compose maps 5444:5432).
      # The domain seed scripts connect to localhost:<this> directly.
      POSTGRES_PORT: '5444'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Generate signing keys
        run: |
          mkdir -p certs
          openssl genrsa -out certs/private.pem 2048
          openssl rsa -in certs/private.pem -pubout -out certs/public.pem

      - name: Boot stack with docker compose
        run: docker compose up -d --build

      - name: Wait for API gateway
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "Gateway healthy"; exit 0
            fi
            sleep 5
          done
          echo "Gateway never came up"; docker compose logs api-gateway; exit 1

      - name: Seed RBAC + test users
        run: |
          # The gateway being healthy does NOT imply auth is ready: auth's
          # container CMD runs `prisma db push && seed:rbac && seed:admin` before
          # it starts serving, so a 200 from auth's own /health is the signal the
          # schema is pushed and RBAC is seeded. Wait for that to avoid racing the
          # seed against a still-initialising auth container.
          echo "Waiting for auth-service to finish db push + seed..."
          for i in $(seq 1 60); do
            if docker exec hrms-auth node -e "require('http').get('http://localhost:4001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "auth-service ready"; break
            fi
            if [ "$i" = "60" ]; then echo "auth-service never became ready"; docker compose logs auth-service; exit 1; fi
            sleep 5
          done
          docker exec hrms-auth node scripts/seed-rbac.js
          cd e2e && npm install --no-audit --no-fund && npm run seed-test-users
          cd ..

          # Reference data (payroll CPF/SDL/components, leave types, claims
          # categories) + employees that the payroll/claims/leave/supervisor
          # specs need. seed.js is now per-phase resilient and skips auth (those
          # users come from seed-test-users). Non-fatal so the rest of the suite
          # still runs even if a seed phase has trouble — failures show as warnings.
          echo "Seeding domain reference data + employees..."
          SEED_SKIP_AUTH=1 node scripts/seed.js || echo "::warning::scripts/seed.js had a failing phase"
          node scripts/seed-employees.js || echo "::warning::scripts/seed-employees.js failed"

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs > compose.log && cat compose.log

  deploy:
    # Production deploy: SSH into the host, pull, rebuild + restart whatever
    # changed. Runs only on push to main (never on PR), and only after both
    # the unit/integration suite AND the e2e suite pass.
    name: Deploy to production
    runs-on: ubuntu-latest
    # secret-scan gates the deploy too: a leaked credential must never reach
    # production, even if every test passes.
    needs: [secret-scan, dependency-audit, backend-and-frontend, tenant-isolation, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never cancel a half-finished deploy
    steps:
      - name: SSH deploy — pull, rebuild, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Tight script: fail-fast, log every step, surface compose output.
          # `--build` rebuilds layers that depend on changed files; Docker
          # skips unchanged services so the typical deploy only churns the
          # services with new code.
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            echo "── Current HEAD ────────────────────────"
            git rev-parse --short HEAD
            echo "── Pulling latest main ─────────────────"
            git fetch origin main
            git reset --hard origin/main
            echo "── New HEAD ────────────────────────────"
            git rev-parse --short HEAD
            echo "── Rebuilding + restarting compose ─────"
            docker compose up -d --build --remove-orphans
            echo "── Pruning dangling images ─────────────"
            docker image prune -f
            echo "── Container status ────────────────────"
            docker compose ps

      - name: Smoke check — api gateway + frontend reachable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            for i in {1..30}; do
              if curl -sf http://localhost:4000/health > /dev/null \
                 && curl -sf http://localhost:3000 > /dev/null; then
                echo "✓ gateway + frontend healthy"; exit 0
              fi
              sleep 5
            done
            echo "✗ services never became healthy"
            cd ${{ secrets.DEPLOY_PATH }} && docker compose logs --tail=80
            exit 1
